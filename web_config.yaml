# ASI-Evolve Web Configuration (Anthropic Claude)
# ================================================
# Used by the web app. Set ANTHROPIC_API_KEY as an environment variable.

experiment_name: "circle_packing_demo"

api:
  provider: "anthropic"
  base_url: "https://api.anthropic.com/v1/"
  api_key: "${ANTHROPIC_API_KEY}"
  model: "claude-sonnet-4-6"
  temperature: 0.6
  max_tokens: 8192
  timeout: 300
  retry_times: 3
  retry_delay: 5

logging:
  level: "INFO"
  console: true
  wandb:
    enabled: false

pipeline:
  agents:
    manager: false
    researcher: true
    engineer: true
    analyzer: true

  researcher:
    diff_based_evolution: false
    max_code_length: 20000

  max_retries:
    researcher: 3
    engineer: 2
    analyzer: 2

  engineer_timeout: 300

  parallel:
    num_workers: 1

  sample_n: 3

  judge:
    enabled: false

cognition:
  storage_dir: "cognition_data"
  embedding:
    model: "sentence-transformers/all-MiniLM-L6-v2"
    dimension: 384
  faiss:
    index_type: "IP"
  retrieval:
    top_k: 3
    score_threshold: 0.3
  web_search:
    enabled: false

database:
  storage_dir: "database_data"
  max_size: 50
  embedding:
    model: "sentence-transformers/all-MiniLM-L6-v2"
    dimension: 384
  sampling:
    algorithm: "ucb1"
    ucb1_c: 1.414
  faiss:
    index_type: "IP"
